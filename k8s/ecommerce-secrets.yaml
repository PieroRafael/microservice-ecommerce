# 🔐 Global Secrets (Fase 2: Contrato de Seguridad)
# ==========================================================
# Este archivo define las configuraciones sensibles protegidas (Base64)
# para el ecosistema completo del E-commerce.
# Estándar 2026: Delegación completa a K8s ETCD. Sustituye las variables hardcodeadas del Spring Cloud Config.

apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  labels:
    part-of: ecommerce-platform
type: Opaque  # Tipo por defecto en K8s para valores K:V ofuscados en Base64
data:
  # Base de Datos (Valor original: 'admin')
  DB_PASSWORD_PRODUCT: YWRtaW4=
  DB_USER_PRODUCT: YWRtaW4=
  DB_PASSWORD_ORDER: YWRtaW4=
  DB_USER_ORDER: YWRtaW4=
  DB_PASSWORD_INVENTORY: YWRtaW4=
  DB_USER_INVENTORY: YWRtaW4=
  
  # Keycloak (Valor original: 'admin')
  KEYCLOAK_ADMIN: YWRtaW4=
  KEYCLOAK_ADMIN_PASSWORD: YWRtaW4=
