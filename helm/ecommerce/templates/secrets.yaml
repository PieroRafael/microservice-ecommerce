# Secret Template (Parametrizado con Go Templates)
# ==========================================================
# Los valores Base64 se inyectan desde values.yaml.
# Helm los pasa tal cual al API Server sin decodificar.

apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
type: Opaque
data:
  DB_USER_PRODUCT: {{ .Values.secrets.database.productUser }}
  DB_PASSWORD_PRODUCT: {{ .Values.secrets.database.productPassword }}
  DB_USER_ORDER: {{ .Values.secrets.database.orderUser }}
  DB_PASSWORD_ORDER: {{ .Values.secrets.database.orderPassword }}
  DB_USER_INVENTORY: {{ .Values.secrets.database.inventoryUser }}
  DB_PASSWORD_INVENTORY: {{ .Values.secrets.database.inventoryPassword }}
  KEYCLOAK_ADMIN: {{ .Values.secrets.keycloak.admin }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.secrets.keycloak.adminPassword }}
